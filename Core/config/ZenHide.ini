; Note: All settings below require relaunching to take effect.

[General]

; Start automatically with Windows (Launches when your PC starts) | Default: true
StartOnBoot = true

; Show tray icon (Lets you open settings or exit from the tray menu) | Default: true
TrayIcon = true


[Idle]

; Hide cursor when inactive | Default: true
HideCursor = true

; Hide desktop icons when inactive | Default: true
HideIcons = true

; Show again only on real mouse movement (Ignores apps that move the cursor on their own) | Default: true
PhysicalMovementOnly = true

; Hide cursor after (1000 = 1 second) | Default: 20000
CursorIdleTime = 20000

; Hide icons after (1000 = 1 second) | Default: 20000
IconsIdleTime = 20000


[Taskbar Fix]

; Fix stuck auto-hide taskbar (Hides the taskbar again when Windows leaves it open) | Default: true
Enabled = true

; Re-hide taskbar after (1000 = 1 second; How long the mouse must stay still first) | Default: 20000
IdleThreshold = 20000


[Hotkeys]

; Enable hotkey | Default: true
Enabled = true

; Hide/show hotkey | Default: Ctrl+Alt+Shift+H
ToggleHide = Ctrl+Alt+Shift+H

; Stay hidden until pressed again (Even after moving the mouse) | Default: false
StayHidden = false


[Advanced]

; Start with admin rights (Uses Task Scheduler) | Default: false
AdminStartup = false

; Cursor check interval (1000 = 1 second; Lower is more responsive) | Default: 1000
CursorCheckInterval = 1000

; Taskbar check interval (1000 = 1 second; Lower is more responsive) | Default: 1000
TaskbarCheckInterval = 1000
